{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Car Rental</title>

    <link rel="stylesheet"
          href="{% static 'vehicles/css/style.css' %}">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🚗 Car Rental
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
        </div>

    </nav>


    <!-- HERO -->

    <section class="hero">

        <div class="hero-content">

            <h1>Find Your Perfect Car</h1>

            <p>
                Rent a car easily and travel comfortably.
            </p>

        </div>

    </section>


    <!-- VEHICLES -->

    <section class="vehicles-section">

        <h2>Available Vehicles</h2>

        <div
            id="vehicle-container"
            class="vehicle-container"
        >

            <p class="loading">
                Loading vehicles...
            </p>

        </div>

    </section>


    <script src="{% static 'vehicles/js/app.js' %}"></script>

</body>

</html>
