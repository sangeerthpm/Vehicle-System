{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Vehicle</title>

    <link rel="stylesheet"
          href="{% static 'vehicles/css/style.css' %}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚗 Car Rental
        </div>

        <a href="/" class="nav-home">
            Home
        </a>

    </nav>


    <section class="booking-section">

        <div class="booking-card">

            <h1>Book Your Vehicle</h1>

            <div id="vehicle-name">
                Loading vehicle...
            </div>

            <form id="booking-form">

                <div class="form-group">

                    <label>Customer Name</label>

                    <input
                        type="text"
                        id="customer_name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="text"
                        id="customer_phone"
                        maxlength="10"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Start Date</label>

                    <input
                        type="date"
                        id="start_date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>End Date</label>

                    <input
                        type="date"
                        id="end_date"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="book-button"
                >
                    Confirm Booking
                </button>

            </form>


            <div id="message" class="message"></div>

        </div>

    </section>


    <script>

        // Get vehicle ID from Django
        const vehicleId = Number("{{ vehicle_id }}");

        console.log("Vehicle ID:", vehicleId);


        // Load vehicle
        async function loadVehicle() {

            try {

                const response = await fetch(
                    `/api/vehicles/${vehicleId}/`
                );

                if (!response.ok) {
                    throw new Error("Vehicle not found");
                }

                const vehicle = await response.json();

                document.getElementById(
                    "vehicle-name"
                ).innerHTML = `

                    <h3>
                        ${vehicle.brand}
                        ${vehicle.name}
                    </h3>

                    <p>
                        ₹${vehicle.price_per_day}
                        / day
                    </p>

                `;

            } catch (error) {

                document.getElementById(
                    "vehicle-name"
                ).innerHTML =
                    "Vehicle could not be loaded.";

            }
        }


        // Submit booking
        document.getElementById(
            "booking-form"
        ).addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const customerName =
                    document.getElementById(
                        "customer_name"
                    ).value;


                const customerPhone =
                    document.getElementById(
                        "customer_phone"
                    ).value;


                const startDate =
                    document.getElementById(
                        "start_date"
                    ).value;


                const endDate =
                    document.getElementById(
                        "end_date"
                    ).value;


                const data = {

                    vehicle: vehicleId,

                    customer_name:
                        customerName,

                    customer_phone:
                        customerPhone,

                    start_date:
                        startDate,

                    end_date:
                        endDate

                };


                try {

                    const response = await fetch(
                        "/api/bookings/",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify(data)
                        }
                    );


                    const result =
                        await response.json();


                    const message =
                        document.getElementById(
                            "message"
                        );


                    if (response.ok) {

                        message.className =
                            "message success";

                        message.innerHTML = `

                            <h3>
                                ✅ Booking Successful!
                            </h3>

                            <p>
                                Booking ID:
                                ${result.id}
                            </p>

                            <p>
                                Total Amount:
                                ₹${result.total_amount}
                            </p>

                            <br>

                            <a href="/">
                                Back to Vehicles
                            </a>

                        `;


                        document.getElementById(
                            "booking-form"
                        ).style.display = "none";


                    } else {

                        message.className =
                            "message error";

                        let errors = "";

                        for (let field in result) {

                            errors += `
                                <p>
                                    ${result[field]}
                                </p>
                            `;

                        }

                        message.innerHTML = errors;

                    }

                } catch (error) {

                    document.getElementById(
                        "message"
                    ).innerHTML =
                        "Something went wrong.";

                    console.log(error);

                }

            }
        );


        loadVehicle();

    </script>

</body>

</html>
